<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Minimalista</title>
    <style>
        body { background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .calc { background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #display { width: 100%; height: 60px; font-size: 2rem; text-align: right; border: none; background: transparent; color: white; margin-bottom: 10px; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 1.2rem; border: none; border-radius: 10px; cursor: pointer; background: #333; color: white; transition: 0.2s; }
        button:hover { background: #444; }
        .op { background: #ff9500; }
        .op:hover { background: #ffaa33; }
        .equal { background: #2196F3; grid-column: span 2; }
    </style>
</head>
<body>

<div class="calc">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button onclick="clearDisplay()" style="grid-column: span 2;">C</button>
        <button class="op" onclick="append('/')">/</button>
        <button class="op" onclick="append('*')">×</button>
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="op" onclick="append('-')">-</button>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="op" onclick="append('+')">+</button>
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const append = (val) => display.value += val;
    const clearDisplay = () => display.value = '';
    const calculate = () => {
        try { display.value = eval(display.value); } 
        catch { display.value = 'Erro'; setTimeout(clearDisplay, 1000); }
    };
</script>

</body>
</html>
